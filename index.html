<script>
const data=JSON.parse(document.getElementById('grouping-data').textContent);
const $=id=>document.getElementById(id);
const esc=text=>String(text).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let side='inputs',groupId='input.breed',selected='breed.labrador_retriever',showSources=false;
const currentGroup=()=>data[side].find(g=>g.id===groupId);
function populateGroups(){
 $('group').innerHTML=data[side].map(g=>'<option value="'+g.id+'">'+(g.parent?'↳ ':'')+esc(g.label)+'</option>').join('');
 $('group').value=groupId;
 document.querySelectorAll('[data-side]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.side===side));
}
function renderTerms(){
 const query=$('search').value.toLowerCase().trim();
 const ids=currentGroup().members.filter(id=>[data.labels[id],...data.evidence[id].map(e=>e.text)].some(s=>s.toLowerCase().includes(query)));
 $('terms').innerHTML=ids.map(id=>'<button class="term" data-term="'+id+'" aria-pressed="'+(selected===id)+'">'+esc(data.labels[id])+'</button>').join('')||'<p class="empty">No terms found in this group.</p>';
 const active=$('terms').querySelector('[aria-pressed=true]');
 if(active)$('terms').scrollTop=active.offsetTop-$('terms').clientHeight/2+active.offsetHeight/2;
}
function sourceDetails(entry){
 const originals=new Map();
 const refs=[];
 for(const cell of entry.cells){
  const original=data.source_entries[cell];
  if(original&&original!==entry.text){
   if(!originals.has(original))originals.set(original,[]);
   originals.get(original).push(cell);
  }else refs.push(cell);
 }
 return '<div class="sources">'+(refs.length?'<p>Source cells: '+refs.map(esc).join(', ')+'</p>':'')+[...originals].map(([text,cells])=>'<details><summary>Original entry · '+cells.map(esc).join(', ')+'</summary><div class="original">'+esc(text)+'</div></details>').join('')+'</div>';
}
function renderDetail(){
 const evidence=data.evidence[selected];
 const numeric=selected==='value.age_diagnosis'||selected==='value.weight';
 const heading=numeric?'Recorded values'+(selected==='value.weight'?' (pounds)':' (years)'):'Original wording grouped here';
 let html='<button class="mobile-back" id="back">← Choose another term</button><p class="breadcrumb">'+(side==='inputs'?'Input':'Output')+' / '+esc(currentGroup().label)+'</p><h2>'+esc(data.labels[selected])+'</h2><h3>'+heading+'</h3><p class="hint">Exact phrases from the source data. Longer entries may contain several phrases.</p>';
 html+=evidence.length?'<ul class="wordings">'+evidence.map(e=>'<li class="wording">'+esc(e.text)+(showSources?sourceDetails(e):'')+'</li>').join('')+'</ul>':'<p class="empty">No source wording has been mapped to this term yet.</p>';
 if(evidence.length)html+='<label class="source-toggle"><input id="sources" type="checkbox" '+(showSources?'checked':'')+'>Show source cells and original entries</label>';
 const children=(data.children[selected]||[]).filter(id=>currentGroup().members.includes(id));
 if(children.length)html+='<div class="subgroups"><p>This broader group also includes:</p>'+children.map(id=>'<button data-term="'+id+'">'+esc(data.labels[id])+'</button>').join('')+'</div>';
 if(side==='outputs')html+='<p class="footnote">This groups wording. Declined or uncertain treatment mentions can appear here.</p>';
 $('detail').innerHTML=html;
}
function selectTerm(id,scroll=false){
 selected=id;renderTerms();renderDetail();
 if(scroll&&window.innerWidth<=720)$('detail').scrollIntoView({block:'start'});
}
document.addEventListener('click',event=>{
 const tab=event.target.closest('[data-side]');
 if(tab){
  side=tab.dataset.side;groupId=side==='inputs'?'input.breed':'cat.cannabis';$('search').value='';
  populateGroups();selectTerm(side==='inputs'?'breed.labrador_retriever':'tx.cbd_oil');return;
 }
 const term=event.target.closest('[data-term]');
 if(term){selectTerm(term.dataset.term,true);return;}
 if(event.target.closest('#back'))document.querySelector('.picker').scrollIntoView({block:'start'});
});
$('group').addEventListener('change',event=>{
 groupId=event.target.value;$('search').value='';selectTerm(currentGroup().members[0]);
});
$('search').addEventListener('input',renderTerms);
$('detail').addEventListener('change',event=>{
 if(event.target.id==='sources'){showSources=event.target.checked;renderDetail();}
});
populateGroups();renderTerms();renderDetail();
</script>
